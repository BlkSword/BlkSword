<svg width="400" height="430" viewBox="0 0 400 430" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="430" rx="32" fill="#eeeed6" stroke="#d8d5bd" stroke-width="2"/>
  <g id="left-ear">
    <g transform="rotate(24 80 130)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 80 130;4 80 130;-4 80 130" dur="2s" repeatCount="indefinite" />
        <ellipse cx="80" cy="130" rx="72" ry="160" fill="#000000" stroke="#3c2724" stroke-width="5"/>
        <ellipse cx="80" cy="130" rx="45" ry="125" fill="#97aa5b"/>
      </g>
    </g>
  </g>
  <g id="right-ear">
    <g transform="rotate(-24 320 130)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 320 130;4 320 130;-4 320 130" dur="2s" repeatCount="indefinite" />
        <ellipse cx="320" cy="130" rx="72" ry="160" fill="#000000" stroke="#3c2724" stroke-width="5"/>
        <ellipse cx="320" cy="130" rx="45" ry="125" fill="#97aa5b"/>
      </g>
    </g>
  </g>
  <rect x="25" y="70" width="350" height="280" rx="150" ry="120" fill="#000000" stroke="#3c2724" stroke-width="5"/>
  <ellipse cx="112" cy="195" rx="85" ry="107" fill="#ffffff" stroke="#3c2724" stroke-width="5" transform="rotate(4 112 195)"/>
  <ellipse cx="288" cy="195" rx="85" ry="107" fill="#ffffff" stroke="#3c2724" stroke-width="5" transform="rotate(-4 288 195)"/>
  <ellipse cx="112" cy="195" rx="57" ry="75" fill="#000000" stroke="#3c2724" stroke-width="5"/>
  <ellipse cx="288" cy="195" rx="57" ry="75" fill="#000000" stroke="#3c2724" stroke-width="5"/>
  <polygon points="200,310 178,340 222,340" fill="#3c2724"/>
  <polygon points="200,315 188,336 212,336" fill="#6cb2d3"/>
  <g id="left-hand">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="1s" repeatCount="indefinite" />
    <rect x="109" y="330" width="70" height="50" rx="25" fill="#000000" stroke="#3c2724" stroke-width="5"/>
  </g>
  <g id="right-hand">
    <animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 12" dur="1s" repeatCount="indefinite" />
    <rect x="221" y="330" width="70" height="50" rx="25" fill="#000000" stroke="#3c2724" stroke-width="5"/>
  </g>
</svg>
